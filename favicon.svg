<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favSnakeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="favNavyCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Fundo Circular de Destaque para Favicon -->
  <circle cx="32" cy="32" r="30" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />

  <!-- Corpo Ondulado da Cobrinha -->
  <path d="M 14 47 C 14 53, 24 53, 29 48 C 34 42, 28 35, 35 29 C 39 26, 42 27, 44 28" 
        stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cabeça da Cobrinha -->
  <ellipse cx="43.5" cy="27.5" rx="9" ry="8" fill="url(#favSnakeSkin)" />
  <ellipse cx="40" cy="30" rx="2.5" ry="1.5" fill="#fca5a5" />

  <!-- Olho Brilhante -->
  <circle cx="45" cy="24" r="3.2" fill="#ffffff" />
  <circle cx="45.6" cy="24.2" r="2" fill="#0f172a" />
  <circle cx="46.5" cy="23.2" r="0.8" fill="#ffffff" />

  <!-- Linguinha Vermelha -->
  <path d="M 50 30 L 53 30 M 53 30 L 55 28.5 M 53 30 L 55 31.5" stroke="#ef4444" stroke-width="1.3" stroke-linecap="round" />

  <!-- Capelo Acadêmico Azul-Marinho -->
  <polygon points="28,14.5 42,19.2 56,14.5 56,16 42,20.5 28,16" fill="#090d16" />
  <polygon points="42,9.5 56,14.5 42,19.2 28,14.5" fill="url(#favNavyCap)" stroke="#1e3a8a" stroke-width="0.6" />
  <ellipse cx="42" cy="14.8" rx="1.4" ry="1" fill="url(#favGold)" />
  <path d="M 42 14.8 Q 35 14.5 32 16 Q 30 18 31 23" fill="none" stroke="url(#favGold)" stroke-width="1.4" stroke-linecap="round" />
  <polygon points="29.5,23.5 32.5,23.5 33,28 29,28" fill="url(#favGold)" />
</svg>
