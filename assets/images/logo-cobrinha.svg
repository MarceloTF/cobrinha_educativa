<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente da pele da cobrinha (verde esmeralda vibrante e acolhedor) -->
    <linearGradient id="snakeSkin" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente de profundidade do contorno da cobrinha -->
    <linearGradient id="snakeOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gradiente do Capelo Acadêmico (Azul-Marinho Clássico Profundo) -->
    <linearGradient id="navyCapTop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente do Tassel / Pingente Dourado de Formatura -->
    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filtro de sombra suave para o ícone -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sombra no Chão (sensação de apoio tridimensional) -->
  <ellipse cx="32" cy="58" rx="20" ry="3.5" fill="#94a3b8" opacity="0.35" />

  <!-- Grupo Principal com Sombra Suave -->
  <g filter="url(#softShadow)">
    <!-- Corpo Ondulado da Cobrinha (Traçado Externo de Contorno) -->
    <path d="M 13 49 C 13 56.5, 25 56.5, 30 50 C 35 43.5, 29 35, 36 29 C 40 25.5, 43 27, 45 28" 
          stroke="url(#snakeOutline)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Corpo Ondulado da Cobrinha (Preenchimento Gradiente Principal) -->
    <path d="M 13 49 C 13 56.5, 25 56.5, 30 50 C 35 43.5, 29 35, 36 29 C 40 25.5, 43 27, 45 28" 
          stroke="url(#snakeSkin)" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Detalhes de Escamas / Pintas Amigáveis no Corpo -->
    <circle cx="19" cy="53" r="1.3" fill="#a7f3d0" opacity="0.9" />
    <circle cx="28" cy="47" r="1.3" fill="#a7f3d0" opacity="0.9" />
    <circle cx="32" cy="38" r="1.3" fill="#a7f3d0" opacity="0.9" />

    <!-- Cabeça Arredondada e Amigável da Cobrinha -->
    <ellipse cx="44.5" cy="27.5" rx="9" ry="8" fill="url(#snakeSkin)" />
    <!-- Contorno suave da bochecha/queixo -->
    <path d="M 37 30 C 40 36, 49 35.5, 52 29" stroke="#059669" stroke-width="1.1" fill="none" stroke-linecap="round" />

    <!-- Bochecha Rosada Cativante -->
    <ellipse cx="40.5" cy="30.5" rx="2.5" ry="1.6" fill="#fca5a5" opacity="0.9" />

    <!-- Sorriso Curvado da Cobrinha -->
    <path d="M 44 31 Q 47.5 32.5 49 30" fill="none" stroke="#065f46" stroke-width="1.3" stroke-linecap="round" />

    <!-- Linguinha Brincalhona Vermelha -->
    <path d="M 50.5 30.5 L 54 30.5 M 54 30.5 L 56.5 28.8 M 54 30.5 L 56.5 32.2" 
          stroke="#ef4444" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Olho Grande Expressivo em Estilo Cartoon -->
    <!-- Esclera (Branco do Olho) -->
    <ellipse cx="45" cy="23.5" rx="3.5" ry="4" fill="#ffffff" stroke="#059669" stroke-width="0.8" />
    <!-- Íris / Pupila (Azul-Marinho Profundo) -->
    <circle cx="45.8" cy="23.7" r="2.2" fill="#0f172a" />
    <!-- Ponto Principal de Brilho nos Olhos (Luz Viva) -->
    <circle cx="46.8" cy="22.7" r="0.95" fill="#ffffff" />
    <!-- Ponto Secundário de Brilho -->
    <circle cx="44.9" cy="24.8" r="0.45" fill="#ffffff" />

    <!-- ============================================== -->
    <!-- CHAPÉU DE FORMATURA (CAPELO ACADÊMICO)         -->
    <!-- Cor: Azul-Marinho Profundo com Pingente Ouro   -->
    <!-- ============================================== -->

    <!-- Base do Capelo (Faixa que encaixa na cabeça) -->
    <path d="M 38 19.5 C 38 17.2, 48 16.5, 50.5 19.5 C 49.5 22.5, 38.5 22.8, 38 19.5 Z" fill="#090d16" />
    <path d="M 38.5 19.3 C 38.5 17.8, 47.5 17.1, 49.8 19.5 C 49 21.8, 39 22, 38.5 19.3 Z" fill="#172554" />

    <!-- Borda Inferior Tridimensional do Tampo do Capelo (Chanfro) -->
    <polygon points="29,13.5 43,18.5 57,13.5 57,15.2 43,20.2 29,15.2" fill="#090d16" />

    <!-- Superfície Superior Losangular do Capelo (Azul-Marinho) -->
    <polygon points="43,8.5 57,13.5 43,18.5 29,13.5" 
             fill="url(#navyCapTop)" stroke="#1e3a8a" stroke-width="0.6" stroke-linejoin="round" />

    <!-- Brilho Sutil na Aresta Superior do Capelo -->
    <line x1="29.5" y1="13.5" x2="43" y2="8.8" stroke="#3b82f6" stroke-width="0.7" opacity="0.6" stroke-linecap="round" />

    <!-- Botão Central Dourado do Capelo -->
    <ellipse cx="43" cy="14.2" rx="1.5" ry="1.1" fill="url(#goldTassel)" stroke="#b45309" stroke-width="0.35" />

    <!-- Cordão do Pingente (Tassel) Dourado Caindo com Graça pela Lateral -->
    <path d="M 43 14.2 Q 36 13.8 32.5 15.2 Q 29.5 17 31 23" 
          fill="none" stroke="url(#goldTassel)" stroke-width="1.35" stroke-linecap="round" />

    <!-- Anel de Fixação do Pingente -->
    <circle cx="31" cy="23.5" r="1.1" fill="#b45309" />

    <!-- Franjas do Pingente de Formatura (Tassel Frills) -->
    <polygon points="29.8,23.8 32.2,23.8 33.2,28.8 28.8,28.8" fill="url(#goldTassel)" />
    <!-- Linhas das Cerdas do Pingente -->
    <line x1="30.2" y1="24.8" x2="30" y2="28.4" stroke="#b45309" stroke-width="0.45" />
    <line x1="31.8" y1="24.8" x2="32" y2="28.4" stroke="#b45309" stroke-width="0.45" />
  </g>
</svg>
